<!doctype html>
<html lang="ar">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>تسجيل الدخول - جامعة بني سويف الأهلية</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body dir="rtl" lang="ar">
  <!-- خلفية مبغشة -->
  <div class="bg"></div>

  <main class="container">
    <aside class="side">
      <div class="logo-wrap">
        <!-- استخدم روابط الصور من الإنترنت أو ضع ملفات محلية -->
        <img alt="BSNU Logo" src="bsnu-logo.png" class="logo" />
      </div>
      <h2>جامعة بني سويف الأهلية</h2>
      <p class="desc">مرحبا بك — سجّل الدخول للوصول إلى بوابة الطلبة والموظفين.</p>

      <div class="side-images">
        <!-- أمثلة لصور من الإنترنت (استبدل بالروابط التي تريدها) -->
        <img alt="صورة الحرم 1" src="campus1.jpg" />
        <img alt="شعار دائري" src="bsnu-round.png" />
      </div>
    </aside>

    <section class="login-card" aria-labelledby="login-title">
      <h1 id="login-title">تسجيل الدخول</h1>

      <form class="login-form" action="#" method="post" autocomplete="on">
        <label for="email">البريد الإلكتروني</label>
        <input id="email" name="email" type="email" placeholder="name@bsnu.edu.eg" required />

        <label for="password">كلمة المرور</label>
        <input id="password" name="password" type="password" placeholder="••••••••" required />

        <div class="actions">
          <label class="remember">
            <input type="checkbox" name="remember" /> تذكرني
          </label>
          <button type="submit" class="btn">دخول</button>
        </div>

        <p class="help-links">
          <a href="#">نسيت كلمة المرور؟</a> · <a href="#">إنشاء حساب جديد</a>
        </p>
      </form>

      <footer class="small">
        © حقوق الطبع محفوظة — جامعة بني سويف الأهلية
      </footer>
    </section>
  </main>
</body>
</html>
